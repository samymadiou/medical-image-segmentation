[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acdc-cardiac-segmentation"
version = "0.1.0"
description = "Cardiac MRI multi-class segmentation pipeline for the ACDC challenge using U-Net and residual U-Net models."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Samy" }
]
license = { text = "MIT" }
keywords = ["medical-imaging", "segmentation", "cardiac-mri", "acdc", "pytorch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "numpy>=1.24.0",
  "scipy>=1.11.0",
  "pandas>=2.0.0",
  "Pillow>=10.0.0",
  "scikit-image>=0.22.0",
  "matplotlib>=3.7.0",
  "medpy>=0.4.0"
]

[tool.setuptools]
include-package-data = true
